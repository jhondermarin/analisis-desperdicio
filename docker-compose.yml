services:
  db:
    image: postgres:16
    container_name: desperdicio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: desperdicio
      POSTGRES_PASSWORD: desperdicio_pass
      POSTGRES_DB: desperdicio
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: